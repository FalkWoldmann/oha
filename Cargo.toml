[package]
authors = ["hatoo <hato2000@gmail.com>"]
categories = [
    "command-line-utilities",
    "network-programming",
    "web-programming::http-client",
    "development-tools::profiling",
]
description = "Ohayou(おはよう), HTTP load generator, inspired by rakyll/hey with tui animation."
edition = "2024"
keywords = ["cli", "load-testing", "performance", "http"]
license = "MIT"
name = "oha"
readme = "README.md"
repository = "https://github.com/hatoo/oha"
version = "1.16.0"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["rustls"]
native-tls = ["dep:native-tls", "compio/native-tls"]
rustls = [
    "dep:rustls",
    "compio/rustls",
    "dep:rustls-native-certs",
    "dep:rustls-pki-types",
]
vsock = ["dep:vsock"]
http3 = ["dep:h3", "compio/h3", "dep:quinn-proto", "dep:http", "dep:socket2"]

[dependencies]
anyhow = "1.0.86"
average = "0.17.0"
byte-unit = "5.1.4"
clap = { version = "4.5.9", features = ["derive", "env"] }
clap_complete = "4"
float-ord = "0.3.2"
kanal = "0.1.1"
humantime = "2.1.0"
libc = "0.2.155"
serde = { version = "1.0.204", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.12"
compio = { version = "0.19.2", features = [
    "polling",
    "net",
    "time",
    "signal",
    "tls",
] }
cyper-core = "0.9.0"
cyper-hickory = "0.1.0"
event-listener = "5.4.0"
futures-channel = "0.3.29"
futures-util = "0.3.30"
ratatui = { version = "0.30.0", default-features = false, features = [
    "crossterm",
] }
aws-sign-v4 = "0.3"
chrono = "0.4"
bytes = "1"

hyper = { version = "1.4", features = ["client", "http1", "http2"] }

# native-tls
native-tls = { version = "0.2.12", features = ["alpn"], optional = true }

rustls = { version = "0.23.18", optional = true }
rustls-native-certs = { version = "0.8.0", optional = true }
rustls-pki-types = { version = "1.7.0", optional = true }

h3 = { version = "0.0.8", optional = true }
# Selects the crypto provider compio's QUIC implementation is built with
quinn-proto = { version = "0.11.13", optional = true, default-features = false, features = [
    "rustls-aws-lc-rs",
] }
http = { version = "1.4.2", optional = true }
socket2 = { version = "0.6", optional = true }

base64 = "0.23.1"
rand = "0.10.2"
hickory-resolver = { version = "0.26.0", default-features = false, features = [
    "system-config",
] }
rand_regex = "0.19.0"
regex-syntax = "0.8.5"
url = "2.5.2"
http-body-util = "0.1.2"
vsock = { version = "0.5.1", optional = true }
rusqlite = { version = "0.40.1", features = ["bundled"] }
num_cpus = "1.16.0"
clap-cargo = "0.19.0"

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.7"

[target.'cfg(unix)'.dependencies]
rlimit = "0.11.0"

[dev-dependencies]
axum = { version = "0.8.1", features = ["http2"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
bytes = "1.6"
float-cmp = "0.10.0"
h3-quinn = "0.0.10"
http-mitm-proxy = { version = "0.18.0", default-features = false }
hyper-util = { version = "0.1.6", features = ["tokio"] }
jsonschema = "0.58.5"
predicates = "3.1.0"
quinn = { version = "0.11.7", features = ["aws-lc-rs", "runtime-tokio"] }
# features = ["aws_lc_rs"] is a workaround for mac & native-tls
# https://github.com/sfackler/rust-native-tls/issues/225
rcgen = { version = "0.14.3", features = ["aws_lc_rs"] }
regex = "1.10.5"
tempfile = "3.10.1"
tokio = { version = "1.38.1", features = ["full"] }
rustls = "0.23.18"
rstest = "0.27.0"
rstest_reuse = "0.7.0"
ctor = "1"

[target.'cfg(unix)'.dev-dependencies]
actix-web = "4"

[target.'cfg(target_os = "linux")'.dev-dependencies]
tokio-vsock = "0.7.2"

[profile.pgo]
inherits = "release"
# https://github.com/TechEmpower/FrameworkBenchmarks/blob/master/frameworks/Rust/faf/Cargo.toml + lto=true
opt-level = 3
panic = 'abort'
codegen-units = 1
lto = true
debug = false
incremental = false
overflow-checks = false

[profile.release-ci]
inherits = "pgo"
